<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Geometric spider avatar">
  <defs>
    <linearGradient id="ringGradient" x1="17" y1="14" x2="103" y2="106" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="bodyGradient" x1="45" y1="34" x2="75" y2="82" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#263144"/>
      <stop offset="0.48" stop-color="#151b2a"/>
      <stop offset="1" stop-color="#090d15"/>
    </linearGradient>
    <filter id="purpleGlow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="2.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
