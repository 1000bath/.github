<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-labelledby="title desc">
  <title id="title">SPIDER tech company logo</title>
  <desc id="desc">Minimal geometric spider logo with gradient ring, dark circular background, glowing eyes, eight legs, and SPIDER wordmark.</desc>
  <defs>
    <linearGradient id="ringGradient" x1="36" y1="30" x2="164" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="bodyGradient" x1="76" y1="62" x2="124" y2="130" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1f2937"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <filter id="purpleGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="cyanGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="100" cy="100" r="91" fill="url(#ringGradient)"/>
  <circle cx="100" cy="100" r="84" fill="#0d1117"/>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M84 78 L56 58 L35 47" stroke="#8b5cf6" stroke-width="8"/>
    <path d="M80 90 L48 83 L28 80" stroke="#8b5cf6" stroke-width="8"/>
    <path d="M80 103 L48 111 L28 116" stroke="#8b5cf6" stroke-width="8"/>
    <path d="M84 116 L57 137 L38 153" stroke="#8b5cf6" stroke-width="8"/>

    <path d="M116 78 L144 58 L165 47" stroke="#06b6d4" stroke-width="8"/>
    <path d="M120 90 L152 83 L172 80" stroke="#06b6d4" stroke-width="8"/>
    <path d="M120 103 L152 111 L172 116" stroke="#06b6d4" stroke-width="8"/>
    <path d="M116 116 L143 137 L162 153" stroke="#06b6d4" stroke-width="8"/>
  </g>

  <circle cx="100" cy="96" r="33" fill="url(#bodyGradient)" stroke="#30363d" stroke-width="3"/>
  <path d="M88 70 Q100 60 112 70" fill="none" stroke="#475569" stroke-width="4" stroke-linecap="round"/>

  <circle cx="90" cy="93" r="5.5" fill="#8b5cf6" filter="url(#purpleGlow)"/>
  <circle cx="110" cy="93" r="5.5" fill="#06b6d4" filter="url(#cyanGlow)"/>

  <text
    x="100"
    y="165"
    fill="#e6edf3"
    font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace"
    font-size="18"
    font-weight="700"
    letter-spacing="4"
    text-anchor="middle">SPIDER</text>
</svg>
