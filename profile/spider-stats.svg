<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 80" role="img" aria-labelledby="title desc">
  <title id="title">Spider stats</title>
  <desc id="desc">GitHub profile stats bar showing packages, tests, dependencies, Node version, and TypeScript strict mode.</desc>
  <rect width="800" height="80" rx="10" fill="#0d1117"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" text-anchor="middle">
    <g>
      <rect x="12" y="12" width="144" height="56" rx="6" fill="#161b22" stroke="#30363d"/>
      <text x="84" y="36" font-size="22" font-weight="700" fill="#8b5cf6">7</text>
      <text x="84" y="55" font-size="9" font-weight="600" letter-spacing="1.8" fill="#8b949e">PACKAGES</text>
    </g>

    <g>
      <rect x="166" y="12" width="144" height="56" rx="6" fill="#161b22" stroke="#30363d"/>
      <text x="238" y="36" font-size="22" font-weight="700" fill="#10b981">400+</text>
      <text x="238" y="55" font-size="9" font-weight="600" letter-spacing="1.8" fill="#8b949e">TESTS</text>
    </g>

    <g>
      <rect x="320" y="12" width="144" height="56" rx="6" fill="#161b22" stroke="#30363d"/>
      <text x="392" y="36" font-size="22" font-weight="700" fill="#f59e0b">0</text>
      <text x="392" y="55" font-size="9" font-weight="600" letter-spacing="1.8" fill="#8b949e">DEPS</text>
    </g>

    <g>
      <rect x="474" y="12" width="144" height="56" rx="6" fill="#161b22" stroke="#30363d"/>
      <text x="546" y="36" font-size="22" font-weight="700" fill="#06b6d4">24+</text>
      <text x="546" y="55" font-size="9" font-weight="600" letter-spacing="1.8" fill="#8b949e">NODE</text>
    </g>

    <g>
      <rect x="628" y="12" width="160" height="56" rx="6" fill="#161b22" stroke="#30363d"/>
      <text x="708" y="36" font-size="22" font-weight="700" fill="#ec4899">TS</text>
      <text x="708" y="55" font-size="9" font-weight="600" letter-spacing="1.8" fill="#8b949e">STRICT</text>
    </g>
  </g>
</svg>
